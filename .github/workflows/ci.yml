# Intégration continue : format, lint, tests Python sans infra, projet dbt sur un lac de test, site.
#
# Les tests d'intégration (Kafka, MinIO, catalogue REST) ne tournent pas ici : ils demandent
# `make up` (docker compose). Les tests dbt tournent sur un petit lac DuckDB fabriqué à partir du
# vrai cycle GDELT de tests/fixtures (transform/ci_fixture.py), pas sur les 18 M d'événements.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (format, lint, tests sans infra)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Dépendances
        run: pip install -e ".[dev,gold]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Jars Spark (cache)
        uses: actions/cache@v6
        with:
          path: |
            jars
            ~/.ivy2.5.2/cache
          key: jars-${{ hashFiles('lakehouse/spark_session.py', 'lakehouse/jars.py') }}
      - name: Résoudre les jars
        run: python -m lakehouse.jars
      - name: Tests sans infra
        env:
          SPARK_DRIVER_MEMORY: 2g
        run: pytest -m "not integration" -q

  dbt:
    name: dbt (modèles et tests sur le lac de test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[gold]"
      - name: Lac de test
        run: python transform/ci_fixture.py
      - name: dbt build (seed, modèles, tests)
        working-directory: transform
        run: >
          dbt build --target ci --profiles-dir .
          --vars '{min_batches_per_day: 1, baseline_days: 5, min_baseline_days: 3}'
      - name: Export du contrat (validation)
        run: python transform/export.py --db transform/target/ci_gold.duckdb --out build/ci/data

  web:
    name: Site (tests et build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
