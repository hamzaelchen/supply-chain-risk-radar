# Déploiement du site de démo (web/) sur GitHub Pages.
#
# Actif depuis le 2026-10-11 : dépôt public, Settings > Pages > Source = « GitHub Actions ».
# Déclencheurs : un push sur main qui touche web/ (ou ce fichier), et le lancement à la main.
# Pas de planification : les données publiées sont celles de web/public/data/, l'export réel du
# backend (`make site-data`, meta.is_sample = false). Rafraîchir les données = relancer le pipeline,
# `make site-data`, committer, pousser.
name: web-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # télécharge aussi l'extension Parquet de DuckDB-WASM (scripts/fetch-duckdb-ext.mjs)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
