# Déploiement du site de démo (web/) sur GitHub Pages.
#
# NON ACTIVÉ, volontairement : le dépôt est privé et GitHub Pages gratuit exige un dépôt public
# (décision du 2026-10-09, déploiement prévu en phase 5 ou 6, voir docs/backlog.md).
# Tant que Pages n'est pas activé dans les réglages du dépôt, ce workflow ne peut rien publier ;
# il n'a aucun déclencheur automatique (ni push ni planification), seulement le lancement à la main.
#
# À faire avant activation : Settings > Pages > Source = « GitHub Actions ». Les données publiées
# sont celles de web/public/data/ : l'export réel du backend (`make site-data`, meta.is_sample =
# false). Rafraîchir les données = relancer le pipeline puis `make site-data` et committer.
name: web-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # télécharge aussi l'extension Parquet de DuckDB-WASM (scripts/fetch-duckdb-ext.mjs)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
