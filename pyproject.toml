[project]
name = "supply-chain-risk-radar"
version = "0.1.0"
description = "Radar de risque supply chain : GDELT -> lakehouse Iceberg"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==4.1.3",
    "pyiceberg[pyarrow]>=0.12,<0.13",
    "confluent-kafka>=2.10,<3",
    "boto3>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Gold : dbt + DuckDB (lit les tables Iceberg de la silver, écrit les exports du site).
gold = [
    "dbt-duckdb==1.11.0",
]
# Uniquement pour comparer H3 aux autres jointures (python -m silver.proximity_bench).
bench = [
    "h3==4.5.0",
    "pandas>=2.2",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "spark: démarre une JVM Spark locale",
    "integration: nécessite l'infra locale (make up)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
